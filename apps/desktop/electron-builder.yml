# electron-builder 打包配置。
#
# 同时产出两种 Windows 包，推荐使用**安装版**（启动无需解压，秒开）：
#   1. 安装版   release/轻松进销存-<version>-setup.exe     ← 装一次，之后启动很快
#   2. 免安装版 release/轻松进销存-<version>-portable.exe  ← 每次启动都要自解压到临时目录，首启较慢
appId: com.qingsong.inventory
productName: 轻松进销存
copyright: Copyright © 2026 轻松进销存

# 离线交付、不做自动更新：显式声明无发布渠道，
# 避免 electron-builder 依据 GH_TOKEN 等环境变量误判 provider 而报错。
publish: null

directories:
  output: release
  buildResources: build

# 主进程 / 预加载脚本已由 esbuild 打包，渲染层由 vite 打包，故只需 dist 与运行时依赖。
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"

# better-sqlite3 为原生模块，打包时按目标平台/Electron ABI 重建（Windows 宿主直接可用）。
# 若从 Linux 交叉构建 Windows 包，需先预取 win32-x64 原生二进制，并追加命令行覆盖：
#   prebuild-install --runtime electron --target 33.4.11 --arch x64 --platform win32
#   electron-builder --win nsis portable -c.npmRebuild=false
npmRebuild: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  # 单用户安装（免管理员/UAC），装完即可用；可自选安装目录
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  # 不打包 elevate.exe（免管理员安装用不到，且其资源改写需要 wine）
  packElevateHelper: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 轻松进销存
  # 卸载时保留业务数据（%APPDATA% 下的数据库），避免误删账套
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  # 解压后的运行目录名，避免用户在中文路径下二次解压出问题
  unpackDirName: qingsong-inventory
  artifactName: ${productName}-${version}-portable.${ext}
